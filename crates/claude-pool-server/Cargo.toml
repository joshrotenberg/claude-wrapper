[package]
name = "claude-pool-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server binary for claude-pool"
documentation = "https://docs.rs/claude-pool-server"
keywords = ["claude", "mcp", "pool", "server"]
categories = ["development-tools"]

[[bin]]
name = "claude-pool-server"
path = "src/main.rs"

[dependencies]
claude-wrapper = { workspace = true }
claude-pool = { workspace = true }
clap = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-mcp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
