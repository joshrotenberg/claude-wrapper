[package]
name = "claude-pool-server"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server binary for claude-pool"
documentation = "https://docs.rs/claude-pool-server"
readme = "README.md"
keywords = ["claude", "mcp", "pool", "server"]
categories = ["development-tools"]

[lib]
name = "claude_pool_server"
path = "src/lib.rs"

[[bin]]
name = "claude-pool-server"
path = "src/main.rs"

[dependencies]
claude-wrapper = { workspace = true }
claude-pool = { workspace = true }
clap = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-mcp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = "6"

[dependencies.axum]
version = "0.8"
optional = true
features = ["json"]

[dependencies.tower-http]
version = "0.6"
optional = true
features = ["cors", "trace"]

[dependencies.async-stream]
version = "0.3"
optional = true

[dependencies.tokio-stream]
version = "0.1"
optional = true

[dependencies.tower]
version = "0.5"
optional = true
features = ["limit"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
serde_json = { workspace = true }
tower-mcp = { workspace = true, features = ["testing"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[features]
default = []
http = ["tower-mcp/http", "dep:axum"]
rest = ["dep:axum", "dep:tower-http", "dep:tower", "dep:async-stream", "dep:tokio-stream"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("rest"))'] }
