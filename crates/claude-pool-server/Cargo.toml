[package]
name = "claude-pool-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server binary for claude-pool"
documentation = "https://docs.rs/claude-pool-server"
readme = "README.md"
keywords = ["claude", "mcp", "pool", "server"]
categories = ["development-tools"]

[lib]
name = "claude_pool_server"
path = "src/lib.rs"

[[bin]]
name = "claude-pool-server"
path = "src/main.rs"

[dependencies]
claude-wrapper = { workspace = true }
claude-pool = { workspace = true }
clap = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-mcp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dependencies.axum]
version = "0.8"
optional = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
serde_json = { workspace = true }
tower-mcp = { workspace = true, features = ["testing"] }

[features]
default = []
http = ["tower-mcp/http", "dep:axum"]
