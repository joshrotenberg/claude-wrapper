# Parallel Research Template
#
# Shape: collect -> parallel research -> summarize
# Use case: gather data, research N topics in parallel, synthesize a report
#
# Fill in: collect prompt, research prompts (add/remove research tasks as needed)
# The summarize task has a fixed prompt — it combines breadcrumbs automatically.

[shared]
model = "claude-sonnet-4-6"
isolation = "none"
permission_mode = "bypassPermissions"
max_turns = 10
no_session_persistence = true
allowed_tools = ["Read", "Write", "WebFetch", "WebSearch", "Bash(curl *)", "Bash(mkdir *)"]
append_system_prompt = """
You are a research assistant. Write output files to output/.
When writing breadcrumbs, use this structure:
## What was done
## Key findings
## Data points
## Sources
"""

chains = [
  ["collect", "research-1", "summarize"],
  ["collect", "research-2", "summarize"],
  ["collect", "research-3", "summarize"],
]

[[tasks]]
name = "collect"
prompt = "TODO: Describe what data to collect and how to categorize it."

[[tasks]]
name = "research-1"
prompt = "TODO: Describe what to research for topic/region 1."

[[tasks]]
name = "research-2"
prompt = "TODO: Describe what to research for topic/region 2."

[[tasks]]
name = "research-3"
prompt = "TODO: Describe what to research for topic/region 3."

[[tasks]]
name = "summarize"
prompt = """
Synthesize all research breadcrumbs into a comprehensive report.
Write the report to output/report.md with:
1. Executive Summary
2. Per-topic sections (from breadcrumbs)
3. Cross-topic patterns and trends
4. Sources
"""
