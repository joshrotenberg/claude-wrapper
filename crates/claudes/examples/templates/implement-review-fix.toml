# Implement-Review-Fix Template
#
# Shape: implement -> review -> fix (breadcrumb chain)
# Use case: self-reviewing code changes — implement, then have a second
#   task review the work and file issues, then a third task fixes them.
#
# Fill in: implement prompt (what to build and where)
# Review and fix tasks use breadcrumbs to pass context forward.

[shared]
model = "claude-sonnet-4-6"
isolation = { type = "worktree", base_dir = ".worktrees" }
permission_mode = "bypassPermissions"
no_session_persistence = true
allowed_tools = ["Read", "Edit", "Glob", "Grep", "Bash(cargo *)", "Bash(git *)", "Bash(gh pr *)"]
disallowed_tools = ["Write"]
append_system_prompt = """
This is a Rust 2024 project. Use if-let chains.
Do NOT modify any file not explicitly named in the task prompt.
"""
post_hooks = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test --lib",
]

chains = [
  ["implement", "review", "fix"],
]

[[tasks]]
name = "implement"
prompt = """
TODO: Describe the feature/change and which files to modify.

Commit your changes when done.
"""

[[tasks]]
name = "review"
prompt = """
Review the implementation from your dependency breadcrumb.
Read the modified files and look for:
- Logic errors or edge cases
- Missing error handling
- Inconsistent naming or style
- Missing tests
- Performance concerns

In your breadcrumb, list each issue found with file, line, and description.
Do NOT modify any files — this is a read-only review.
"""
allowed_tools = ["Read", "Glob", "Grep"]
disallowed_tools = ["Edit", "Write", "Bash(cargo *)", "Bash(git *)"]
post_hooks = []

[[tasks]]
name = "fix"
prompt = """
Address the review findings from your dependency breadcrumb.
Fix each issue listed. Then commit and create a PR.
"""
