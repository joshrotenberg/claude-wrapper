[package]
name = "claudes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-agent orchestrated CLI for Claude Code"
keywords = ["claude", "ai", "orchestration", "multi-agent"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "claudes"
path = "src/main.rs"

[dependencies]
claude-wrapper = { workspace = true, features = ["json"] }
claude-pool = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
