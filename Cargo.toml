[package]
name = "claude-wrapper"
version = "0.6.0"
edition = "2024"
rust-version = "1.90.0"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/claude-wrapper"
description = "A type-safe Claude Code CLI wrapper for Rust"
documentation = "https://docs.rs/claude-wrapper"
readme = "README.md"
keywords = ["claude", "cli", "wrapper", "ai", "mcp"]
categories = ["development-tools", "api-bindings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["async", "json", "tempfile"]
# Async API (tokio-backed). In default features for back-compat;
# disable via `default-features = false` to drop the tokio dep.
async = ["dep:tokio"]
json = ["serde_json"]
tempfile = ["dep:tempfile"]
# Blocking/synchronous API. With `default-features = false,
# features = ["json", "sync"]` you get a tokio-free build.
sync = ["dep:wait-timeout"]
# MCP server layer over the wrapper. Exposes both a low-level surface
# (1:1 with command builders) and a high-level "talk to the agent"
# surface as MCP tools via tower-mcp. Requires async + json.
server = [
    "async",
    "json",
    "dep:tower-mcp",
    "dep:schemars",
    "dep:ulid",
    "dep:toml",
    "dep:tracing-subscriber",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt-multi-thread", "sync"], optional = true }
tracing = "0.1"
tempfile = { version = "3", optional = true }
wait-timeout = { version = "0.2", optional = true }
which = "8"

# `server` feature deps: MCP layer over the wrapper.
tower-mcp = { version = "0.10", optional = true }
schemars = { version = "1", optional = true }
ulid = { version = "1", optional = true }
toml = { version = "0.9", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "claude-server"
path = "src/bin/server.rs"
required-features = ["server"]

# All examples use the async API; require the feature so they're
# skipped automatically on sync-only builds.
[[example]]
name = "agent_worker"
required-features = ["async", "json"]

[[example]]
name = "health_check"
required-features = ["async"]

[[example]]
name = "json_output"
required-features = ["async", "json"]

[[example]]
name = "mcp_config"
required-features = ["async"]

[[example]]
name = "oneshot"
required-features = ["async"]

[[example]]
name = "stream_query"
required-features = ["async", "json"]

[[example]]
name = "supervised_worker"
required-features = ["async", "json"]
