[package]
name = "claude-wrapper"
version = "0.13.3"
edition = "2024"
rust-version = "1.90.0"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/claude-wrapper"
description = "A type-safe Claude Code CLI wrapper for Rust"
documentation = "https://docs.rs/claude-wrapper"
readme = "README.md"
keywords = ["claude", "cli", "wrapper", "ai", "mcp"]
categories = ["development-tools", "api-bindings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["async", "json", "tempfile"]
# Async API (tokio-backed). In default features for back-compat;
# disable via `default-features = false` to drop the tokio dep.
async = ["dep:tokio"]
json = ["serde_json"]
tempfile = ["dep:tempfile"]
# Blocking/synchronous API. With `default-features = false,
# features = ["json", "sync"]` you get a tokio-free build.
sync = ["dep:wait-timeout"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt", "sync"], optional = true }
tracing = "0.1"
tempfile = { version = "3", optional = true }
wait-timeout = { version = "0.2", optional = true }
which = "8"

[dev-dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1.1"

# All examples use the async API; require the feature so they're
# skipped automatically on sync-only builds.
[[example]]
name = "agent_worker"
required-features = ["async", "json"]

# Spike: `cr`, a minimal config-driven CLI over the wrapper's sync API.
# Not a shipped binary -- an evaluation prototype. `cargo run --example cr
# --no-default-features --features sync,json,tempfile -- ...`
[[example]]
name = "cr"
required-features = ["sync", "json"]

[[example]]
name = "duplex_chat"
required-features = ["async", "json"]

[[example]]
name = "duplex_http_service"
required-features = ["async", "json"]

[[example]]
name = "duplex_interrupt"
required-features = ["async", "json"]

[[example]]
name = "health_check"
required-features = ["async"]

[[example]]
name = "inspect_state"
required-features = ["json"]

[[example]]
name = "json_output"
required-features = ["async", "json"]

[[example]]
name = "mcp_config"
required-features = ["async"]

[[example]]
name = "oneshot"
required-features = ["async"]

[[example]]
name = "stream_query"
required-features = ["async", "json"]

[[example]]
name = "supervised_worker"
required-features = ["async", "json"]
