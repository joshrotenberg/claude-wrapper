[workspace]
resolver = "3"
members = [
    "crates/claude-wrapper",
    "crates/claude-pool",
    "crates/claude-pool-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.90.0"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/claude-wrapper"

[workspace.dependencies]
claude-wrapper = { path = "crates/claude-wrapper", version = "0.3" }
claude-pool = { path = "crates/claude-pool", version = "0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
dashmap = "6"
tower-mcp = { version = "0.8", default-features = false }
schemars = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
