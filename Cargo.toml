[workspace]
resolver = "3"
members = ["crates/claude-wrapper"]
# Deprecated, unmaintained crates. Kept on disk for history but excluded
# from the workspace so they don't pollute CI, `cargo test`, or
# dependabot scans. Revive by moving back into `members` if needed.
exclude = [
    "crates/claude-pool",
    "crates/claude-pool-mcp",
    "crates/claudes",
    "crates/claude-runner",
]

[workspace.package]
edition = "2024"
rust-version = "1.90.0"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/claude-wrapper"

[workspace.dependencies]
claude-wrapper = { path = "crates/claude-wrapper", version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
dashmap = "6"
tower-mcp = { version = "0.10", default-features = false }
schemars = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
