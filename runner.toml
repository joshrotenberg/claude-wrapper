repo = "joshrotenberg/claude-wrapper"
eligible_labels = ["runner:ready"]
exclude_labels = ["blocked", "needs-design", "runner:in-progress", "runner:complete"]
branch_pattern = "automation/{issue}-{slug}"
max_concurrency = 3
auto_merge = false
agent = "claude"
model = "claude-sonnet-4-6"
validation_commands = [
    "cargo fmt --all -- --check",
    "cargo clippy --all-targets -- -D warnings",
    "cargo test --lib",
]

# Per-workflow concurrency limits.
# 0 = unlimited (up to the global max_concurrency cap).
# Workflows not listed here default to unlimited.
[concurrency]
bug = 1
feature = 2
research = 0
